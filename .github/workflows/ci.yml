name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -x -s bash shell/claude-sandbox.sh test/test.sh
          shellcheck install.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh and fish (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        run: brew install fish
      - name: Show shell versions
        run: |
          /bin/bash --version | head -1
          zsh --version
          fish --version
      - name: bash
        run: /bin/bash test/test.sh
      - name: zsh
        run: zsh test/test.sh
      - name: fish
        run: fish test/test.fish
